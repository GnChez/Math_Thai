# MySQL + MongoDB locales para Math Game (Server/mySQL.js, Server/mongoDB.js).
#
# Arranque: docker compose up -d
#
# MySQL (puerto 3306):
#   Base: mathgame  Usuario: mathgame  Contraseña: mathgame  Root: root
#   El esquema y datos de prueba se cargan la primera vez desde Server/database/schema.sql
#
# MongoDB (puerto 27017):
#   Tras levantar el contenedor: cd Server && npm run seed:mongo
#   (MONGODB_URI por defecto: mongodb://127.0.0.1:27017)

services:
  mysql:
    image: mysql:8.4
    container_name: mathgame-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mathgame
      MYSQL_USER: mathgame
      MYSQL_PASSWORD: mathgame
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  mongo:
    image: mongo:7
    container_name: mathgame-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
